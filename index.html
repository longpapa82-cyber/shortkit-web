<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>숏킷 shortKit — 유튜브 영상, 핵심만 30초 요약</title>
    <meta name="description" content="긴 유튜브 영상, 링크만 붙여넣으면 AI가 핵심만 30초로 요약해드려요. 자막이 없어도 음성 인식으로 요약. 레시피·운동·리뷰·지식까지 유형별 핵심 정리." />
    <meta name="theme-color" content="#3182F6" />

    <!-- 파비콘(브라우저 탭·북마크 아이콘) — 앱 로고마크 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/og-image.png" />

    <!-- Open Graph (카카오톡·슬랙 등 URL 공유 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="숏킷 shortKit — 유튜브 영상, 핵심만 30초" />
    <meta property="og:description" content="링크만 붙여넣으면 AI가 핵심만 30초로 요약. 아낀 시간은 쌓여요." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter/X 카드 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="숏킷 shortKit — 유튜브 영상, 핵심만 30초" />
    <meta name="twitter:description" content="링크만 붙여넣으면 AI가 핵심만 30초로 요약." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Pretendard (앱과 동일 타이포) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <!-- SoftwareApplication 구조화 데이터(SEO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "숏킷 shortKit",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Android, iOS",
        "description": "유튜브 영상을 AI로 30초 핵심 요약해주는 앱",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
